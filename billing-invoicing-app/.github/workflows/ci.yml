name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: billing-invoicing-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: billing-invoicing-app/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src test scripts

      # mongodb-memory-server downloads a real mongod and runs a single-node
      # replica set in-process, so the document validators and the
      # transactions are exercised without provisioning a service container.
      - name: Ledger tests
        run: npm test

      - name: Build
        env:
          AUTH_SECRET: ci-placeholder-secret-000000000000
          MONGODB_URI: mongodb://localhost:27017/none
        run: npm run build
