# The app, on your own machine. The database is not one of these services —
# MongoDB Atlas is a managed replica set, which this application's transactions
# require, and standing up your own replica set in a container is more to
# operate than a solo developer needs. Point MONGODB_URI at your Atlas cluster.
#
#   cp .env.example .env      # then fill in MONGODB_URI and AUTH_SECRET
#   docker compose up -d --build
#   docker compose run --rm app node dist-scripts/setup.cjs --email you@yourdomain.com --password "..."
#
# The app listens on 127.0.0.1:3000. Put a reverse proxy in front of it for TLS
# and your domain -- see DEPLOY.md. Self-hosting MongoDB instead of Atlas is
# also covered there.

services:
  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in .env to your Atlas connection string}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env — generate with `npx auth secret`}
      AUTH_URL: ${AUTH_URL:?set AUTH_URL in .env — your public https URL}
      AUTH_TRUST_HOST: 'true'
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      WEBHOOK_ENDPOINT: ${WEBHOOK_ENDPOINT:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    # Bound to loopback: the reverse proxy is the only thing that should be able
    # to reach the app directly. Change to '3000:3000' only if nothing else is
    # in front of it.
    ports:
      - '127.0.0.1:3000:3000'
    # Indexes and validators are ensured before the server starts, every boot.
    # That is idempotent, so a restart is a no-op.
    command: sh -c "node dist-scripts/migrate.cjs && node server.js"

  # Delivers queued webhook events. Started only when you ask for it:
  #   docker compose --profile webhooks up -d
  outbox:
    build:
      context: .
    restart: unless-stopped
    profiles: ['webhooks']
    environment:
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in .env}
      WEBHOOK_ENDPOINT: ${WEBHOOK_ENDPOINT:?set WEBHOOK_ENDPOINT to run the outbox worker}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET to run the outbox worker}
    command: node dist-scripts/outbox-worker.cjs
