# Baked into the `web` image (Dockerfile.client) to serve the built SPA.
# This is deliberately separate from docker/nginx/default.conf, which is
# the edge reverse-proxy's config running in its own `nginx-proxy`
# container in front of this one — two different Nginx processes, two
# different jobs (this one only ever serves static files on the internal
# Docker network; TLS, security headers, and rate limiting live at the edge).

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Unprivileged nginx (see Dockerfile.client) can't write the default
    # /var/log/nginx/*.log paths under some runtimes; send access logs to
    # stdout/stderr like the rest of the stack instead.
    access_log /dev/stdout;
    error_log  /dev/stderr;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets (Vite fingerprints every filename) are safe to
    # cache forever; index.html is not, since it's what points at the
    # current hashes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback: any route react-router owns (e.g. /emr/HIMS-26-000123)
    # is not a real file on disk — serve index.html and let the client
    # router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
