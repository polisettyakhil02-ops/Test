# Edge reverse proxy for the HIMS stack — the `nginx-proxy` service in
# docker-compose.prod.yml. Terminates TLS, routes /api/* to the backend
# and everything else to the frontend's own Nginx (docker/nginx/client.conf),
# and is the only container in the stack with a port published to the
# public internet.
#
# BEFORE FIRST USE: replace every "yourdomain.com" below with your real
# domain (see DEPLOYMENT.md, which gives the exact `sed` command), and
# follow DEPLOYMENT.md's certbot bootstrap procedure — Nginx will refuse
# to start if the ssl_certificate paths below don't exist yet.

# WebSocket upgrade support: only kicks in on a request that actually asks
# for it (the `Upgrade` header set); a plain HTTP request gets `Connection:
# close` as usual. hims-backend doesn't open a WebSocket endpoint yet (e.g.
# for a live OPD token-queue display), so this is inert until one exists —
# left wired up now so adding one later is a backend-only change.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Zones must be declared once at http level (any file under conf.d/ is
# included inside the base image's `http {}` block) and referenced by name
# in the `location` blocks below.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

upstream hims_api {
    server api:4000;
    keepalive 32;
}

upstream hims_web {
    server web:8080;
    keepalive 16;
}

# Plain HTTP: only serves the ACME (Let's Encrypt) challenge and redirects
# everything else to HTTPS — no application traffic is ever served here.
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yourdomain.com www.yourdomain.com;

    ssl_certificate         /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/yourdomain.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers. `always` so they're also sent on error responses
    # (4xx/5xx), not just 2xx — a header a browser only sometimes sees is a
    # header it can't be relied on for.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
    # Defense in depth: force Secure + SameSite=Strict on every cookie
    # passing through, regardless of what the upstream app itself set.
    proxy_cookie_flags ~ secure samesite=strict;

    client_max_body_size 5m;
    limit_conn conn_limit 20;

    # Kept reachable here too in case Nginx is reloaded (not fully
    # restarted) mid-renewal while still terminating TLS on 443.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tighter limit specifically on auth endpoints — login/refresh are the
    # brute-force / credential-stuffing target, so they get a stricter
    # ceiling than the rest of the API.
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://hims_api/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://hims_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;

        # WebSocket upgrade passthrough (see the `map` block above).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location = /healthz {
        proxy_pass http://hims_api/healthz;
        access_log off;
    }

    # Everything else (the SPA and its client-side routes) goes to the
    # frontend container; client.conf there owns the actual SPA fallback.
    location / {
        proxy_pass http://hims_web/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
