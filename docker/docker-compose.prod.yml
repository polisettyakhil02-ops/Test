# Production stack for the HIMS platform. Targets the Docker Compose V2 CLI
# (`docker compose ...`), which doesn't use/need a top-level `version:` key.
#
# Run every command from this directory (docker/) so Compose auto-loads
# ./.env for the ${VAR} interpolation used throughout this file — see
# .env.example and DEPLOYMENT.md.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Network layout: `hims-internal` is an `internal: true` network — mongo1-3
# and redis are unreachable from outside the Docker host by design, even if
# a container on it were compromised, it cannot reach the internet through
# that network. `api` bridges both networks (it's the only thing that needs
# to reach the database tier AND be reached by the edge proxy); `web` and
# `nginx-proxy` only need `hims-edge`.

networks:
  hims-internal:
    internal: true
  hims-edge:
    driver: bridge

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
  redis_data:
  certbot_certs:
  certbot_www:

services:
  # ------------------------------------------------------------------------
  # MongoDB 3-node replica set — required for the mongoose.startSession()
  # multi-document transactions PharmacyService/ADTService/BillingService
  # depend on (see hims-backend/src/config/database.ts). Host ports are
  # bound to 127.0.0.1 only: useful for `mongosh` debugging from the VPS
  # itself over an SSH tunnel, deliberately not reachable from the internet
  # (container-to-container traffic never touches these published ports at
  # all — it goes over hims-internal using the container's actual 27017).
  # ------------------------------------------------------------------------
  mongo1:
    image: mongo:7.0
    restart: unless-stopped
    command: ["--replSet", "${MONGO_REPLICA_SET_NAME:-rs0}", "--keyFile", "/run/secrets/mongo-keyfile", "--bind_ip_all"]
    volumes:
      - mongo1_data:/data/db
      - ${MONGO_KEYFILE_PATH:-./secrets/mongo-keyfile}:/run/secrets/mongo-keyfile:ro
    ports:
      - "127.0.0.1:27017:27017"
    networks: [hims-internal]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo2:
    image: mongo:7.0
    restart: unless-stopped
    command: ["--replSet", "${MONGO_REPLICA_SET_NAME:-rs0}", "--keyFile", "/run/secrets/mongo-keyfile", "--bind_ip_all"]
    volumes:
      - mongo2_data:/data/db
      - ${MONGO_KEYFILE_PATH:-./secrets/mongo-keyfile}:/run/secrets/mongo-keyfile:ro
    ports:
      - "127.0.0.1:27018:27017"
    networks: [hims-internal]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo3:
    image: mongo:7.0
    restart: unless-stopped
    command: ["--replSet", "${MONGO_REPLICA_SET_NAME:-rs0}", "--keyFile", "/run/secrets/mongo-keyfile", "--bind_ip_all"]
    volumes:
      - mongo3_data:/data/db
      - ${MONGO_KEYFILE_PATH:-./secrets/mongo-keyfile}:/run/secrets/mongo-keyfile:ro
    ports:
      - "127.0.0.1:27019:27017"
    networks: [hims-internal]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Transient — initiates the replica set and creates the root + scoped
  # app users on first boot, then exits 0. Re-running the stack later is
  # a no-op (see mongo/init-replica.sh). `network_mode: service:mongo1`
  # is load-bearing, not incidental — see the script's own header comment
  # for exactly why (the MongoDB "localhost exception" for bootstrapping
  # auth only applies to true loopback connections).
  mongo-setup:
    image: mongo:7.0
    depends_on:
      mongo1: { condition: service_healthy }
      mongo2: { condition: service_healthy }
      mongo3: { condition: service_healthy }
    network_mode: "service:mongo1"
    restart: "no"
    environment:
      MONGO_REPLICA_SET_NAME: "${MONGO_REPLICA_SET_NAME:-rs0}"
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD}"
      MONGO_APP_USERNAME: "${MONGO_APP_USERNAME}"
      MONGO_APP_PASSWORD: "${MONGO_APP_PASSWORD}"
      MONGO_APP_DATABASE: "${MONGO_APP_DATABASE:-hims}"
    volumes:
      - ./mongo/init-replica.sh:/init-replica.sh:ro
    entrypoint: ["bash", "/init-replica.sh"]

  # ------------------------------------------------------------------------
  # Redis — sessions/refresh-token denylist, OPD token-queue counters,
  # rate-limit buckets, read-through caches (see hims-backend/src/config/redis.ts).
  # ------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks: [hims-internal]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------------------------------------------------
  # Backend API
  # ------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    image: hims-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      mongo-setup: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGODB_URI: "mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo1:27017,mongo2:27017,mongo3:27017/${MONGO_APP_DATABASE:-hims}?replicaSet=${MONGO_REPLICA_SET_NAME:-rs0}&authSource=${MONGO_APP_DATABASE:-hims}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET}"
      JWT_ACCESS_TTL_SECONDS: "${JWT_ACCESS_TTL_SECONDS:-900}"
      JWT_REFRESH_TTL_SECONDS: "${JWT_REFRESH_TTL_SECONDS:-1209600}"
      COOKIE_SECRET: "${COOKIE_SECRET}"
      CORS_ORIGIN: "${CORS_ORIGIN}"
      UHID_PREFIX: "${UHID_PREFIX:-HIMS}"
      AUDIT_LOG_RETENTION_DAYS: "${AUDIT_LOG_RETENTION_DAYS:-2555}"
    networks: [hims-internal, hims-edge]
    # No published ports — only reachable from nginx-proxy over hims-edge.

  # ------------------------------------------------------------------------
  # Frontend (static SPA behind its own internal Nginx — see Dockerfile.client)
  # ------------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-/api}"
    image: hims-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [hims-edge]
    # No published ports — only reachable from nginx-proxy over hims-edge.

  # ------------------------------------------------------------------------
  # Edge reverse proxy — the only container with ports published to the
  # public internet. TLS termination, security headers, rate limiting.
  # ------------------------------------------------------------------------
  nginx-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks: [hims-edge]

  # ------------------------------------------------------------------------
  # Certbot — not started by `up` (profile-gated). Run on demand for the
  # first certificate and for renewals; see DEPLOYMENT.md for the exact
  # bootstrap sequence (Nginx must already be serving the ACME challenge
  # path before the first issuance can succeed).
  # ------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
