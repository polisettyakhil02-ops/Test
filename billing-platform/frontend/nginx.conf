server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The bundle is already gzipped better by a CDN, but this image is often the
  # only thing in front of the browser.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Nothing here is user-supplied HTML, but these cost nothing and close off
  # the obvious foot-guns.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;

  # Hashed filenames: safe to cache forever, and a deploy changes the name.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html is the one file that must never be cached — it is what points at
  # the current bundle, so a stale copy pins the browser to the old deploy.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Same origin as the API, so the session cookie is a first-party cookie and
  # CORS never enters the picture. `backend` is the Compose service name; with
  # a different topology, change the upstream and nothing else.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # PDF generation is the slow path; the default 60s is enough, but say so
    # rather than leaving it to be discovered.
    proxy_read_timeout 120s;
  }

  # Client-side routing: every unknown path is a route in the SPA, not a missing
  # file. Without this, a refresh on /documents/<id> would 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
