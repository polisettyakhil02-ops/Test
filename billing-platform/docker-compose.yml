# Two services: the API and the browser app behind nginx. The database is not
# one of them — MongoDB Atlas is a managed replica set, which is what this
# application's transactions require, and standing up your own replica set in
# a container is more to operate than a solo developer needs. Point
# MONGODB_URI at your Atlas cluster and there is nothing else to run.
#
#   cp .env.example .env      # then edit the two secrets and MONGODB_URI
#   docker compose up -d --build
#   docker compose run --rm backend node dist/scripts/setup.js \
#     --email you@company.com --password 'your-password' \
#     --company 'Your Business Pvt Ltd' --state 29
#
# Then open http://localhost:8080.
#
# Self-hosting MongoDB instead of Atlas? See DEPLOY.md — a single `mongod`
# container works, but it needs a one-time replica-set initiation step Compose
# cannot express as a health check, which is why it is not wired in here by
# default.

name: billing

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in .env to your Atlas connection string}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-43200}
      # Same-origin through nginx, so the browser never makes a cross-origin
      # call and this list only matters if you also hit the API directly.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      COOKIE_CROSS_SITE: ${COOKIE_CROSS_SITE:-false}
      PORT: 4000
      WEBHOOK_ENDPOINT: ${WEBHOOK_ENDPOINT:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    # Indexes and validators are ensured on every boot. That is idempotent —
    # unlike a SQL migration there is nothing to "already have run", so this
    # can never start a server against a database missing a check it depends on.
    command: sh -c "node dist/scripts/migrate.js && node dist/index.js"
    # Not published: nginx is the only thing that needs to reach it. Uncomment
    # to curl the API from the host.
    # ports:
    #   - "127.0.0.1:4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        # Empty: the bundle calls /api on its own origin and nginx proxies it.
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-8080}:8080"

  # The webhook worker. Off by default; start it with
  #   docker compose --profile webhooks up -d
  # once WEBHOOK_ENDPOINT and WEBHOOK_SECRET are set.
  outbox:
    build: ./backend
    restart: unless-stopped
    profiles: ["webhooks"]
    environment:
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in .env}
      DATABASE_POOL_MAX: 2
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      WEBHOOK_ENDPOINT: ${WEBHOOK_ENDPOINT:?set WEBHOOK_ENDPOINT to run the worker}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET to run the worker}
      OUTBOX_INTERVAL_MS: ${OUTBOX_INTERVAL_MS:-5000}
    command: node dist/scripts/outbox-worker.js
