# Three services: the database, the API, and the browser app behind nginx.
#
#   cp .env.example .env      # then edit the two secrets
#   docker compose up -d --build
#   docker compose run --rm backend node dist/scripts/setup.js \
#     --email you@company.com --password 'your-password' \
#     --company 'Your Business Pvt Ltd' --state 29
#
# Then open http://localhost:8080.

name: billing

services:
  db:
    build: ./db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-billing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-billing}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Not published by default: nothing outside this network needs to reach
    # PostgreSQL, and an exposed database is the one mistake that is hard to
    # take back. Uncomment to run psql from the host.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-billing} -d ${POSTGRES_DB:-billing}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-billing}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-billing}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-43200}
      # Same-origin through nginx, so the browser never makes a cross-origin
      # call and this list only matters if you also hit the API directly.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      COOKIE_CROSS_SITE: ${COOKIE_CROSS_SITE:-false}
      PORT: 4000
      WEBHOOK_ENDPOINT: ${WEBHOOK_ENDPOINT:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    # Migrations run on every boot. They record what they have applied, so this
    # is a no-op once the schema is current — and it means a deploy can never
    # start a server against a schema older than its code.
    command: sh -c "node dist/scripts/migrate.js && node dist/index.js"
    # Not published either: nginx is the only thing that needs to reach it.
    # Uncomment to curl the API from the host.
    # ports:
    #   - "127.0.0.1:4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        # Empty: the bundle calls /api on its own origin and nginx proxies it.
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-8080}:8080"

  # The webhook worker. Off by default; start it with
  #   docker compose --profile webhooks up -d
  # once WEBHOOK_ENDPOINT and WEBHOOK_SECRET are set.
  outbox:
    build: ./backend
    restart: unless-stopped
    profiles: ["webhooks"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-billing}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-billing}
      DATABASE_POOL_MAX: 2
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      WEBHOOK_ENDPOINT: ${WEBHOOK_ENDPOINT:?set WEBHOOK_ENDPOINT to run the worker}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET to run the worker}
      OUTBOX_INTERVAL_MS: ${OUTBOX_INTERVAL_MS:-5000}
    command: node dist/scripts/outbox-worker.js

volumes:
  db-data:
